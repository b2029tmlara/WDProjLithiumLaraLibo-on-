<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ProjectPages">
    <meta name="author" content="Nathan Allen Libo-on, Travis Marco Lara">
    <title>88 Keys</title>
    <link rel="icon" href="../assets/pianologo.jpg" sizes="20x20" type="image/jng">
    <link rel="stylesheet" href="pagestyles.css">
    <script src="script.js" defer></script>
    
    <meta charset="UTF-8">
    <title> Personal Head </title>
</head>
<body>

    <form method="post" action="submit" onsubmit="return confirmAction('submit')" onreset="return confirmAction('reset')">
        
        <fieldset>
            <legend>Personal Identification</legend>
            <label>Full Name:
                <input type="text" name="fullName" required onblur="checkEmpty(this)">
            </label>
            <label>Birthday:
                <input type="date" name="birthday" required>
            </label>
            <label>Email Address:
                <input type="email" name="email" required onblur="checkEmpty(this)">
            </label>
        </fieldset>

        <fieldset>
            <legend> Piano Capabilities</legend>

            <label> Skill Level:
                <select name="skillLevel" required>
                    <option value="">--Select Level--</option>
                    <option value="BEGINNER">Beginner</option>
                    <option value="INTERMEDIATE">Intermediate</option>
                    <option value="ADVANCED">Advanced</option>
                </select>
            </label>

            <label> Preffered Genre:
                 <select name="genre" required>
                    <option value="">--Select a Genre--</option>
                    <option value="CLASSICAL">Classical</option>
                    <option value="JAZZ">Jazz</option>
                    <option value="POP">Pop</option>
                    <option value="ROCK">Rock</option>
                    <option value="COUNTRY">Country</option>
            </label>

                <label for="practice-time" class="slider-container">Practice Time:
                    <input type="range" id="practice-time" min="0.5" max="8" step="0.5" value="4" required>
                    <div class="slider-labels">
                    <span>0.5</span>
                    <span>1</span>
                    <span>1.5</span>
                    <span>2</span>
                    <span>2.5</span>
                    <span>3</span>
                    <span>3.5</span>
                    <span>4</span>
                    <span>4.5</span>
                    <span>5</span>
                    <span>5.5</span>
                    <span>6</span>
                    <span>6.5</span>
                    <span>7</span>
                    <span>7.5</span>
                    <span>8</span>
                    </div>
                </div>
                </label>
            
            <label> Available Practice Days:
                <input type="checkbox" name="sunday" value="sunday"> Sunday
                <input type="checkbox" name="monday" value="monday"> Monday
                <input type="checkbox" name="tuesday" value="tuesday"> Tuesday
                <input type="checkbox" name="wednesday" value="wednesday"> Wednesday
                <input type="checkbox" name="thursday" value="thursday"> Thursday
                <input type="checkbox" name="friday" value="friday"> Friday
                <input type="checkbox" name="saturday" value="saturday"> Saturday
            </label>

            <label> Main Goal:
                <textarea name="mainGoal" required onblur="checkEmpty(this)"></textarea>
            </label>
        </fieldset>

        <div class="button-group">
            <input type="submit" value="Submit Information">
            <input type="reset" value="Reset Form">
            <button type="button"><a href="../index.html"> Home </a></button>
        </div>
    </form>

</body>
</html>
